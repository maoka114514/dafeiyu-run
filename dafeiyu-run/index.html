<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大肥鱼快跑 · 第一篇章</title>
<style>
  html,body{margin:0;height:100%;background:#0e1118;overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,1000px);image-rendering:pixelated;touch-action:none;cursor:pointer}
  #err{position:fixed;left:16px;top:16px;right:16px;color:#ff8f8f;font:13px/1.6 monospace;
       white-space:pre-wrap;background:#1a0f0f;border:1px solid #522;padding:12px;border-radius:8px;display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="320"></canvas></div>
<div id="err"></div>
<script type="module">
const errBox = document.getElementById('err');
const fail = (msg) => { errBox.style.display = 'block'; errBox.textContent = '加载失败：\n' + msg; };

const loadJSON = async (path) => {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
};

// 内容校验：字段缺了就直接报错，别跑起来变成隐形怪
function validate(d) {
  const errs = [];
  if (!d.sprites || !d.sprites.run0 || !d.sprites.palette) errs.push('sprites.json 缺 run0 或 palette');
  if (!Array.isArray(d.items)) errs.push('items.json 必须是数组');
  else d.items.forEach((it, i) => {
    ['id', 'slot', 'name', 'price'].forEach(k => { if (!(k in it)) errs.push('items[' + i + '] 缺 ' + k); });
    if (it.slot && ['head', 'face', 'tail'].indexOf(it.slot) < 0) errs.push('items[' + i + '].slot 非法: ' + it.slot);
  });
  if (!d.enemies || typeof d.enemies !== 'object') errs.push('enemies.json 必须是对象');
  if (!d.chapter || !Array.isArray(d.chapter.levels) || !d.chapter.levels.length) errs.push('chapter1.json 缺 levels');
  else d.chapter.levels.forEach((lv, i) => {
    ['speed', 'dur', 'gap'].forEach(k => { if (typeof lv[k] !== 'number') errs.push('levels[' + i + '] 缺 ' + k); });
  });
  if (errs.length) throw new Error(errs.join('\n'));
}

try {
  const [sprites, items, enemies, chapter] = await Promise.all([
    loadJSON('content/sprites.json'),
    loadJSON('content/items.json'),
    loadJSON('content/enemies.json'),
    loadJSON('content/chapter1.json'),
  ]);
  const data = { sprites, items, enemies, chapter };
  validate(data);
  const { start } = await import('./engine/game.js');
  const q = new URLSearchParams(location.search);
  const opts = (q.get('dev') === '1' && q.get('lv')) ? { level: +q.get('lv') } : {};
  start(data, opts);
} catch (e) {
  fail(e.message || String(e));
  console.error(e);
}
</script>
</body>
</html>
